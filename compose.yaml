name: labapp

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:18-alpine
    restart: unless-stopped # restart on crash/reboot unless you stop it manually
    environment:
      POSTGRES_USER: ${DB_USERNAME} # superuser name, read from DB_USERNAME in .env
      POSTGRES_PASSWORD: ${DB_PASSWORD} # password for that user, from DB_PASSWORD
      POSTGRES_DB: ${DB_DATABASE} # database name, from DB_DATABASE
    volumes:
      - db-data:/var/lib/postgresql # persist data so it survives container removal
    healthcheck:
      # -h 127.0.0.1 checks over TCP, so it only passes once the real server is up.
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "${DB_USERNAME}",
          "-d",
          "${DB_DATABASE}",
        ]
      interval: 5s # check every 5 seconds
      timeout: 3s # each check fails if it takes longer than 3s
      retries: 10 # postgres takes longer to boot than Redis, so allow more retries
      start_period: 20s # failures during the first 20s don't count against retries

  app:
    build:
      context: .
      target: final
    image: labapp:local
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    image: labapp:local # reuse the image app builds (no build: key, so no second build)
    # replaces the default php-fpm with the queue worker
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--max-time=3600",
      ]
    restart: unless-stopped # brings the worker back after --max-time exits it every hour
    env_file:
      - .env # same settings as app
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy # jobs need the database
      redis:
        condition: service_healthy # jobs are pulled from the Redis queue
    healthcheck:
      # the worker has no port, so test it can reach Redis
      test: ["CMD", "php", "-r", "exit(@fsockopen('redis', 6379) ? 0 : 1);"]
      interval: 5s # check every 5 seconds
      timeout: 3s # each check fails if it takes longer than 3s
      retries: 5 # unhealthy after 5 failed checks in a row

  web:
    build:
      context: . # build from the project folder
      target: web # use the "web" (Nginx) stage in the Dockerfile
    image: labapp-web:local # name of the built image (same one you tested)
    restart: unless-stopped # restart on crash/reboot unless you stop it
    ports:
      - "127.0.0.1:8080:80" # Mac port 8080 -> Nginx port 80, only on this Mac (not Wi-Fi)
    volumes:
      # same uploads as app, read-only (Nginx only serves them)
      - uploads:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy # wait until PHP-FPM is up, so Nginx can find "app"
    healthcheck:
      # checks Nginx -> FPM -> Laravel /up
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 5s # check every 5 seconds
      timeout: 3s # each check fails if it takes longer than 3s
      retries: 5 # unhealthy after 5 failed checks in a row

volumes:
  redis-data:
  db-data: # named volume for postgres data
  uploads:
