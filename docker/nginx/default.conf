server {
    listen 80;
    server_name _;
    server_tokens off;

    # Docker's embedded DNS server (the 127.0.0.11 in every container's resolv.conf).
    # valid=10s = cache each answer for 10 seconds, then ask again,
    # so a recreated app is found within 10 s.
    # ipv6=off = only ask for IPv4 addresses (the Compose network is IPv4 only).
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /var/www/html/public;
    index index.php;

    location ^~ /.well-known/ {
        allow all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ^~ = prefix match. If the URL starts with /build/, Nginx uses this block and
    # skips the regex locations below (no chance of it reaching the PHP block).
    location ^~ /build/ {
        # Serve the file if it exists, otherwise Nginx returns 404 itself.
        # No fallback to /index.php, so PHP never sees these requests.
        try_files $uri =404;

        # Vite puts a content hash in each filename (app--mIAqjJm.css). A new build
        # = a new filename, so browsers and Cloudflare can keep these for 1 year.
        # immutable = the browser doesn't even re-check the file on refresh.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Don't log every CSS/JS hit, which keeps the logs readable.
        access_log off;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;

        # A variable instead of a fixed "app:9000".
        # Nginx can't resolve a variable at startup, so it resolves it per request
        # through the resolver above (cached for valid=10s).
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
